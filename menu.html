<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oliva | Menu</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!--Link bootstrap-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
   
     <!--Link css-->
    <link rel="stylesheet" href="css/global.css">

</head>

<body>
    <!--Componente Navbar-->
    <div id="navbar-container"></div>
    
    <main>
    <!--Search Bar-->     
        <form         id="searchForm" >
            <label   for="searchInput">Pesquisa</label>
            <input    id="searchInput" required>
            <button type="submit"     >Pesquisar</button>
        </form>

    <!--Search Filters-->
        <div     class="btn-group justify-content-space-between" role="group">
            <button id="btnTodos"      type="button" >Todos</button>
            <button id="btnEntradas"   type="button" >Entradas</button>
            <button id="btnPratos"     type="button" >Pratos</button>
            <button id="btnSobremesas" type="button" >Sobremesas</button>
            <button id="btnBebidas"    type="button" >Bebidas</button>
        </div>

    <!--Search Results-->
        <div          id="searchContainer" class="container">
            <div      id="searchBox"       class="row justify-content-space-between row-cols-1 row-cols-md-2 row-cols-lg-3 gy-4 gx-4 mt-3">       
            </div>
        </div>
    </main>


    <!--Componente Footer-->
    <div id="footer-container"></div>

    <!--Chama os scripts -->
    <script src="js/footer.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/script.js"></script>
    <script src="js/menu.js"  ></script>

    <!--Link script bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>

</body>
</html>
